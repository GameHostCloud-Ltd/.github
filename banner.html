<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; overflow:hidden; }
  html {
    background:
      radial-gradient(900px 320px at 85% -10%, hsla(275,80%,60%,0.28), transparent 60%),
      radial-gradient(700px 300px at 8% 110%, hsla(217,91%,60%,0.18), transparent 60%),
      linear-gradient(180deg, hsl(230,30%,15%), hsl(232,32%,12%));
  }
  body {
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(900px 320px at 85% -10%, hsla(275,80%,60%,0.28), transparent 60%),
      radial-gradient(700px 300px at 8% 110%, hsla(217,91%,60%,0.18), transparent 60%),
      linear-gradient(180deg, hsl(230,30%,15%), hsl(232,32%,12%));
    display:flex; align-items:center; padding:0 72px; gap:56px; position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image:linear-gradient(hsla(270,80%,70%,0.05) 1px,transparent 1px),
      linear-gradient(90deg,hsla(270,80%,70%,0.05) 1px,transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(1000px 320px at 30% 50%,black,transparent 85%);
    -webkit-mask-image:radial-gradient(1000px 320px at 30% 50%,black,transparent 85%);
  }
  .emblem { width:200px; height:200px; object-fit:contain; filter:drop-shadow(0 8px 28px hsla(275,80%,55%,0.45)); flex-shrink:0; position:relative; }
  .col { position:relative; display:flex; flex-direction:column; gap:16px; }
  .word {
    font-family:'Montserrat',sans-serif; font-weight:800; font-size:64px; letter-spacing:0.06em;
    line-height:1; white-space:nowrap;
    background:linear-gradient(90deg,hsl(270,80%,60%),hsl(260,75%,58%),hsl(217,91%,60%),hsl(200,85%,55%),hsl(30,95%,55%),hsl(270,80%,60%));
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tag {
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:19px;
    letter-spacing:0.34em; color:hsl(270,45%,78%);
  }
  .chips { display:flex; gap:14px; margin-top:6px; }
  .chip {
    font-family:'Inter',sans-serif; font-weight:600; font-size:15.5px; color:hsl(260,40%,92%);
    padding:9px 18px; border-radius:999px;
    background:hsla(232,28%,20%,0.85);
    border:1px solid hsla(275,80%,68%,0.4);
    box-shadow:inset 0 1px 0 hsla(0,0%,100%,0.06);
    display:flex; align-items:center; gap:8px;
  }
  .dot { width:8px; height:8px; border-radius:50%; }
</style></head>
<body>
  <div class="grid"></div>
  <img class="emblem" src="profile/assets/ghc-emblem.webp" alt="">
  <div class="col">
    <div class="word">GAMEHOSTCLOUD</div>
    <div class="tag">PREMIUM GAME SERVER HOSTING</div>
    <div class="chips">
      <div class="chip"><span class="dot" style="background:hsl(270,80%,62%)"></span>59 games</div>
      <div class="chip"><span class="dot" style="background:hsl(217,91%,62%)"></span>4 continents</div>
      <div class="chip"><span class="dot" style="background:hsl(200,85%,58%)"></span>22 languages</div>
      <div class="chip"><span class="dot" style="background:hsl(30,95%,58%)"></span>NVMe + Ryzen</div>
    </div>
  </div>
</body></html>
